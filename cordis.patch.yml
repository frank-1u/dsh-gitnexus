- insert:
    - id: gitnexus-context-injector
      name: dsh-gitnexus
      config:
        cliCommand: gitnexus
        enableAugment: true
        enableStaleNotice: true
        augmentTimeoutMs: 7000
        staleTimeoutMs: 3000
        contextMaxChars: 12000
        cacheTtlMs: 300000
        staleNoticeTtlMs: 600000
        maxConcurrent: 2
        debug: false

    - id: mcp-gitnexus
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: gitnexus
        transport: stdio
        command: gitnexus
        args: [mcp]
