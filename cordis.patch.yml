- insert:
    - id: gitnexus-context-injector
      name: dsh-gitnexus
      config:
        cliCommand: gitnexus
        enableAugment: true
        enableStaleNotice: true
        augmentTimeoutMs: 7000
        staleTimeoutMs: 5000
        contextMaxChars: 12000
        cacheTtlMs: 300000
        staleNoticeTtlMs: 600000
        maxConcurrent: 2
        debug: false
